<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>המילון האישי שלי בערבית</title>
  <link rel="stylesheet" href="style.css?v=16">
  <link rel="stylesheet" href="phrases.css?v=3">
</head>
<body>
  <main class="wrap">
    <header>
      <h1 id="pageTitle">המילון שלי</h1>
      <nav class="app-navigation" aria-label="ניווט ראשי">
        <button class="app-navigation-item active" id="dictionaryViewButton" type="button" data-view="dictionary" aria-pressed="true">מילון</button>
        <button class="app-navigation-item" id="phrasesViewButton" type="button" data-view="phrases" aria-pressed="false">משפטים</button>
      </nav>
      <span class="status" id="status">טוען…</span>
    </header>
    <section class="grid" id="grid"></section>
    <section class="phrase-view" id="phraseView" hidden>
      <table class="phrase-table">
        <thead><tr><th scope="col">תעתיק</th><th scope="col">מילולית</th><th scope="col">בעברית</th></tr></thead>
        <tbody id="phraseRows"></tbody>
      </table>
    </section>
  </main>

  <aside class="control-panel" aria-label="חיפוש, סינון ומיון מילים">
    <div class="category-panel" id="filterPanel" hidden>
      <div class="category-panel-head">
        <strong>נושאים</strong>
        <button class="clear" id="clearFilters" type="button">נקה הכול</button>
      </div>
      <nav class="chips" id="topicChips" aria-label="בחירת נושאים"></nav>
      <div class="filter-section">
        <strong>סוג מילה</strong>
        <div class="chips part-chips" id="partChips" aria-label="בחירת סוגי מילים"></div>
      </div>
      <div class="filter-section">
        <strong>מיון</strong>
        <div class="chips" id="sortChips" aria-label="בחירת סדר המילים"></div>
      </div>
    </div>
    <div class="category-panel phrase-family-panel" id="phraseFilterPanel" hidden>
      <div class="category-panel-head">
        <strong>משפחות מילים</strong>
        <button class="clear" id="clearPhraseFamilies" type="button">נקה הכול</button>
      </div>
      <nav class="chips phrase-family-chips" id="phraseFamilyChips" aria-label="סינון לפי משפחות מילים"></nav>
      <div class="filter-section">
        <strong>סדר</strong>
        <div class="chips" aria-label="שינוי סדר המשפטים">
          <button class="chip" id="shufflePhrases" type="button">Shuffle</button>
          <button class="chip" id="resetPhraseOrder" type="button">Reset</button>
        </div>
      </div>
    </div>
    <div class="control-panel-inner">
      <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="filterPanel" aria-label="פתיחת סינון ומיון" title="סינון ומיון">
        <span aria-hidden="true">☷</span>
        <span class="filter-count" id="filterCount" hidden></span>
      </button>
      <input id="search" class="search" type="search" placeholder="חיפוש…" aria-label="חיפוש מילים">
    </div>
  </aside>

  <script src="app.js?v=28"></script>
</body>
</html>

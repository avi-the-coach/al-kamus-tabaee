<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>המילון האישי שלי בערבית</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>המילים שלי בערבית</h1>
      <span class="status" id="status">טוען…</span>
    </header>
    <section class="grid" id="grid"></section>
  </main>

  <aside class="control-panel" aria-label="חיפוש וסינון מילים">
    <div class="category-panel" id="categoryPanel" hidden>
      <div class="category-panel-head">
        <strong>קטגוריות</strong>
        <button class="clear" id="clearCategories" type="button">נקה הכול</button>
      </div>
      <nav class="chips" id="chips" aria-label="בחירת קטגוריות"></nav>
    </div>
    <div class="control-panel-inner">
      <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="categoryPanel" aria-label="פתיחת קטגוריות" title="קטגוריות">
        <span aria-hidden="true">☷</span>
        <span class="filter-count" id="filterCount" hidden></span>
      </button>
      <input id="search" class="search" type="search" placeholder="חיפוש…" aria-label="חיפוש מילים">
    </div>
  </aside>

  <script src="app.js?v=5"></script>
</body>
</html>
